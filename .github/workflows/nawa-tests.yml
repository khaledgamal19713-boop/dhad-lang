name: NAWA kernel tests
on:
  push:
    paths:
      - "nawa/**"
      - ".github/workflows/nawa-tests.yml"
  pull_request:
    paths:
      - "nawa/**"
      - ".github/workflows/nawa-tests.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test nawa/tests/*.test.mjs
      - run: python -m py_compile nawa/training/finetune_lora.py
      - run: python -m unittest discover -s nawa/training -p 'test_*.py'
      - run: node nawa/demo.mjs
