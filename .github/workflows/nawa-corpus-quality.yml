name: NAWA corpus quality gates
on:
  push:
    paths: ["nawa/corpus/**","nawa/training/**","nawa/corpus.mjs","nawa/tests/**","package.json",".github/workflows/nawa-corpus-quality.yml"]
  pull_request:
    paths: ["nawa/corpus/**","nawa/training/**","nawa/corpus.mjs","nawa/tests/**","package.json",".github/workflows/nawa-corpus-quality.yml"]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: npm run build
      - run: node --test nawa/tests/*.test.mjs
