name: Nawa integration checks
on:
  push:
    branches: [main, nawa-first-integration]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: npm run build
      - name: Verify Nawa is in build output
        run: test -s dist/nawa.html
